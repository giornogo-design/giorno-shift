<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>スタッフ認証テスト</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <p id="status">認証テストを準備しています…</p>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const targetText = new URL(location.href).searchParams.get('target');
        const target = new URL(targetText || '');
        if (target.origin !== 'https://script.google.com' ||
            !/^\/macros\/s\/[A-Za-z0-9_-]+\/dev$/.test(target.pathname)) {
          throw new Error('テスト先が正しくありません');
        }

        await liff.init({ liffId: '2010395925-JfheOL3d' });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }

        const idToken = liff.getIDToken();
        if (!idToken) throw new Error('ログイン情報を取得できませんでした');
        const claims = liff.getDecodedIDToken();
        const tokenChecks = {
          hasSubject: !!(claims && claims.sub),
          audienceMatches: String(claims && claims.aud) === '2010395925',
          issuerMatches: !!(claims && claims.iss === 'https://access.line.me'),
          unexpired: !!(claims && Number(claims.exp) > Math.floor(Date.now() / 1000))
        };

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = target.href;
        form.target = '_blank';
        for (const [name, value] of Object.entries({
          transport: 'authenticatedWeb',
          action: 'getStaff',
          idToken
        })) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          form.appendChild(input);
        }
        document.body.appendChild(form);

        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'スタッフ認証テストを実行';
        button.addEventListener('click', () => {
          button.disabled = true;
          status.textContent = 'テスト環境でスタッフ情報を確認しています…';
          form.submit();
        });
        document.body.appendChild(button);
        status.textContent = `準備できました。トークン確認: ${JSON.stringify(tokenChecks)}`;
      } catch (error) {
        status.textContent = `認証テストを開始できませんでした: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
