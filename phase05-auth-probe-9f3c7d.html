<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>認証テスト</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <p id="status">認証テストを準備しています…</p>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const targetText = new URL(location.href).searchParams.get('target');
        const target = new URL(targetText || '');
        if (target.origin !== 'https://script.google.com' ||
            !/^\/macros\/s\/[A-Za-z0-9_-]+\/dev$/.test(target.pathname)) {
          throw new Error('テスト先が正しくありません');
        }

        await liff.init({ liffId: '2010395925-JfheOL3d' });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }

        const idToken = liff.getIDToken();
        if (!idToken) throw new Error('ログイン情報を取得できませんでした');

        status.textContent = '準備できました。下のボタンで認証テストを実行します。';
        const payload = {
          transport: 'authenticatedWeb',
          action: 'authPing',
          idToken
        };
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = '認証テストを実行';
        button.addEventListener('click', async () => {
          button.disabled = true;
          status.textContent = 'テスト環境で認証を確認しています…';
          try {
            const response = await fetch(target.href, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
              body: new URLSearchParams(payload)
            });
            const result = await response.json();
            status.textContent = `認証結果: ${JSON.stringify(result)}`;
          } catch (error) {
            status.textContent = `認証通信に失敗しました: ${error.message}`;
            button.disabled = false;
          }
        });
        document.body.appendChild(button);
      } catch (error) {
        status.textContent = `認証テストを開始できませんでした: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
